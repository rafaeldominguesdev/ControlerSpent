name: confeitaria
description: Precificação e controle para confeitaria.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  animations: ^3.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  intl: any
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/abertura.png
    - assets/logo/abertura_fundo.png

# Ícone do app (gerado com: dart run flutter_launcher_icons). Desenho em assets/logo/*.svg
flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/logo/icone.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/logo/icone_fundo.png"
  adaptive_icon_foreground: "assets/logo/icone_frente.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/icone.png"
    background_color: "#3555FE"
    theme_color: "#366FFD"
